{% extends "news/base.html" %}
{% block content %}
<h1>Delete {{ kind }}?</h1>
<p>“{{ object }}” will be removed permanently. This cannot be undone.</p>
<form method="post" class="actions">
  {% csrf_token %}
  <button class="button danger" type="submit">Yes, delete it</button>
  <a class="button secondary" href="{{ cancel_url.get_absolute_url }}">Cancel</a>
</form>
{% endblock %}
