{% extends "news/base.html" %}
{% block title %}Log in · The Daily Ledger{% endblock %}
{% block content %}
<h1>Log in</h1>
<form class="form" method="post" novalidate>
  {% csrf_token %}
  {{ form.as_p }}
  <input type="hidden" name="next" value="{{ next }}">
  <div class="actions"><button class="button" type="submit">Log in</button></div>
</form>
<p>New here? <a href="{% url 'news:signup' %}">Create an account</a>.</p>
{% endblock %}
